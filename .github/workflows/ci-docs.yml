# Caller owns on:. Pinned by commit SHA; Dependabot bumps it.
# Do not set jobs.docs.name: the required check is docs / ci.
name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  docs:
    uses: qntx/workflows/.github/workflows/ci-docs.yml@b1a930e790044f34f06bd5e1e0ede9e7dd5fa122 # v2.13.1
    permissions:
      contents: read
