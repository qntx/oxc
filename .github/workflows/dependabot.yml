# Caller owns on:. Pinned by commit SHA; Dependabot bumps it.
# schedule / workflow_dispatch squash-merge green Dependabot PRs.
# Daily cron 0 4 * * * (04:00 UTC).
# Do not checkout the PR. Does not approve.
name: Dependabot

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: read

jobs:
  merge:
    permissions:
      contents: write
      pull-requests: write
      checks: read
      actions: read
    uses: qntx/workflows/.github/workflows/ops-dependabot.yml@b1a930e790044f34f06bd5e1e0ede9e7dd5fa122 # v2.13.1
