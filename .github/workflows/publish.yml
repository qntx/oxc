name: Publish

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  id-token: write

jobs:
  oxlint:
    uses: qntx/workflows/.github/workflows/publish-npm.yml@b1a930e790044f34f06bd5e1e0ede9e7dd5fa122 # v2.13.1
    permissions:
      contents: read
      id-token: write
    with:
      package-manager: bun
      bun-version: "1.4"
      install-directory: .
      working-directory: packages/oxlint

  oxfmt:
    uses: qntx/workflows/.github/workflows/publish-npm.yml@b1a930e790044f34f06bd5e1e0ede9e7dd5fa122 # v2.13.1
    permissions:
      contents: read
      id-token: write
    with:
      package-manager: bun
      bun-version: "1.4"
      install-directory: .
      working-directory: packages/oxfmt
