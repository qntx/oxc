name: Publish

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  id-token: write

jobs:
  oxlint:
    uses: qntx/workflows/.github/workflows/publish-npm.yml@v2.0.0
    permissions:
      contents: read
      id-token: write
    with:
      package-manager: bun
      bun-version: "1.4"
      install-directory: .
      working-directory: packages/oxlint

  oxfmt:
    uses: qntx/workflows/.github/workflows/publish-npm.yml@v2.0.0
    permissions:
      contents: read
      id-token: write
    with:
      package-manager: bun
      bun-version: "1.4"
      install-directory: .
      working-directory: packages/oxfmt
