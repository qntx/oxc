# Adopted releases must be at least 7 days old (cooldown). Minor and patch
# updates are grouped per ecosystem so the open-PR limit never fills up;
# majors stay individual PRs and are merged by hand.
version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    # These must equal the versions vite-plus pins (tests/versions.test.ts)
    # and move only together with a vite-plus bump.
    ignore:
      - dependency-name: "oxlint"
      - dependency-name: "oxfmt"
      - dependency-name: "oxlint-tsgolint"
    groups:
      bun-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
